<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#160F0C"
  />

  <title>Balenrista Stock</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Splash&display=swap"
    rel="stylesheet"
  />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --soft-dove: #C0BAB3;
      --spiced-hot-chocolate: #52423D;
      --moon-rock: #887D77;
      --dark-sienna: #391214;
      --black-raspberry: #160F0C;

      --surface: rgba(82, 66, 61, 0.34);
      --surface-light: rgba(192, 186, 179, 0.08);
      --border: rgba(192, 186, 179, 0.16);

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--soft-dove);
      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(57, 18, 20, 0.65),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(82, 66, 61, 0.32),
          transparent 28%
        ),
        var(--black-raspberry);

      font-family:
        "Goldman",
        "Noto Sans Thai",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    svg {
      display: block;
    }

    /* ========================================
       APP
    ======================================== */

    .app {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      padding-bottom: 110px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      color: var(--soft-dove);
      font-family: "Splash", cursive;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 0.95;
      letter-spacing: 0.02em;
    }

    .brand-subtitle {
      color: var(--moon-rock);
      font-family: "Goldman", "Noto Sans Thai", sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .glass-button {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--soft-dove);
      background: var(--surface-light);

      border: 1px solid var(--border);
      border-radius: 50%;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .glass-button:hover {
      transform: translateY(-2px);
      background: rgba(192, 186, 179, 0.12);
    }

    .glass-button svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
    }

    /* ========================================
       HERO
    ======================================== */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 30px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          135deg,
          rgba(82, 66, 61, 0.5),
          rgba(57, 18, 20, 0.28)
        );

      box-shadow: var(--shadow);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      margin-bottom: 22px;
    }

    .hero::after {
      content: "";

      position: absolute;
      width: 220px;
      height: 220px;

      right: -80px;
      top: -100px;

      border-radius: 50%;

      background: rgba(192, 186, 179, 0.06);
      filter: blur(10px);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: var(--moon-rock);

      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .hero h1 {
      color: var(--soft-dove);

      font-size: clamp(25px, 4vw, 42px);
      font-weight: 700;

      line-height: 1.2;

      margin-bottom: 10px;
    }

    .hero-description {
      max-width: 620px;

      color: var(--moon-rock);

      font-family:
        "Goldman",
        "Noto Sans Thai",
        sans-serif;

      font-size: 13px;
      line-height: 1.7;
    }

    /* ========================================
       SEARCH
    ======================================== */

    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box svg {
      position: absolute;

      left: 18px;
      top: 50%;

      width: 18px;
      height: 18px;

      color: var(--moon-rock);

      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      height: 56px;

      padding: 0 18px 0 52px;

      color: var(--soft-dove);
      background: rgba(82, 66, 61, 0.28);

      border: 1px solid var(--border);
      border-radius: 18px;

      outline: none;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .search-box input::placeholder {
      color: var(--moon-rock);
    }

    .search-box input:focus {
      border-color: rgba(192, 186, 179, 0.35);
      background: rgba(82, 66, 61, 0.4);
    }

    .filter-button {
      width: 56px;
      height: 56px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--soft-dove);
      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .filter-button svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
    }

    /* ========================================
       SECTION HEADER
    ======================================== */

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 15px;

      margin: 28px 2px 14px;
    }

    .section-title {
      color: var(--soft-dove);

      font-size: 17px;
      font-weight: 700;
    }

    .section-count {
      color: var(--moon-rock);
      font-size: 11px;
    }

    /* ========================================
       CATEGORY
    ======================================== */

    .category-row {
      display: flex;
      gap: 8px;

      overflow-x: auto;
      padding-bottom: 4px;

      scrollbar-width: none;

      margin-bottom: 22px;
    }

    .category-row::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      flex-shrink: 0;

      height: 38px;

      padding: 0 17px;

      color: var(--moon-rock);

      background: rgba(192, 186, 179, 0.055);

      border: 1px solid var(--border);
      border-radius: 999px;

      font-size: 10px;
      letter-spacing: 0.04em;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .category-chip.active {
      color: var(--soft-dove);
      background: rgba(57, 18, 20, 0.7);
      border-color: rgba(192, 186, 179, 0.22);
    }

    /* ========================================
       PRODUCT GRID
    ======================================== */

    .product-grid {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .product-card {
      position: relative;
      overflow: hidden;

      min-width: 0;

      background:
        linear-gradient(
          145deg,
          rgba(82, 66, 61, 0.34),
          rgba(22, 15, 12, 0.55)
        );

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .product-image {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 5;

      overflow: hidden;

      background: rgba(22, 15, 12, 0.5);
    }

    .product-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition: transform 0.35s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.025);
    }

    .item-number {
      position: absolute;

      left: 10px;
      top: 10px;

      min-width: 34px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 8px;

      color: var(--soft-dove);
      background: rgba(22, 15, 12, 0.68);

      border: 1px solid rgba(192, 186, 179, 0.14);
      border-radius: 999px;

      font-size: 9px;
      letter-spacing: 0.08em;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .product-info {
      padding: 15px;
    }

    .product-name-en {
      color: var(--soft-dove);

      font-size: 12px;
      line-height: 1.45;

      margin-bottom: 5px;
    }

    .product-name-th {
      color: var(--moon-rock);

      font-family:
        "Noto Sans Thai",
        sans-serif;

      font-size: 11px;
      line-height: 1.5;

      margin-bottom: 12px;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .product-unit {
      color: var(--moon-rock);

      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stock-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      color: var(--moon-rock);

      font-size: 9px;
    }

    .stock-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--moon-rock);
    }

    /* ========================================
       LOADING
    ======================================== */

    .status {
      grid-column: 1 / -1;

      min-height: 180px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: var(--moon-rock);

      background: rgba(82, 66, 61, 0.18);

      border: 1px solid var(--border);
      border-radius: 22px;
    }

    /* ========================================
       BOTTOM NAV
    ======================================== */

    .bottom-nav {
      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 16px;

      width: min(calc(100% - 28px), 560px);

      transform: translateX(-50%);

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 8px;

      background: rgba(22, 15, 12, 0.78);

      border: 1px solid rgba(192, 186, 179, 0.14);
      border-radius: 24px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .nav-item {
      position: relative;

      min-height: 56px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      color: var(--moon-rock);

      background: transparent;

      border-radius: 17px;

      font-size: 8px;

      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .nav-item svg {
      width: 19px;
      height: 19px;

      stroke: currentColor;

      stroke-width: 1.6;
    }

    .nav-item.active {
      color: var(--soft-dove);
      background: rgba(57, 18, 20, 0.65);
    }

    /* ========================================
       DESKTOP
    ======================================== */

    @media (min-width: 700px) {

      .app {
        padding: 34px;
        padding-bottom: 120px;
      }

      .product-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .hero {
        padding: 40px;
      }
    }

    @media (min-width: 1100px) {

      .product-grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
        gap: 20px;
      }

      .bottom-nav {
        width: 620px;
      }
    }

    /* ========================================
       SMALL MOBILE
    ======================================== */

    @media (max-width: 390px) {

      .app {
        padding: 18px;
        padding-bottom: 105px;
      }

      .topbar {
        margin-bottom: 25px;
      }

      .brand-name {
        font-size: 32px;
      }

      .hero {
        padding: 24px;
      }

      .hero h1 {
        font-size: 23px;
      }

      .product-grid {
        gap: 10px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name-en {
        font-size: 10px;
      }

      .product-name-th {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="topbar">

      <div class="brand">
        <div class="brand-name">Balenrista</div>

        <div class="brand-subtitle">
          Coffee Supply Inventory
        </div>
      </div>

      <div class="top-actions">

        <button
          class="glass-button"
          aria-label="Language"
          title="Language"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3c2.2 2.4 3.4 5.4 3.4 9s-1.2 6.6-3.4 9"></path>
            <path d="M12 3c-2.2 2.4-3.4 5.4-3.4 9s1.2 6.6 3.4 9"></path>
          </svg>
        </button>

        <button
          class="glass-button"
          aria-label="Settings"
          title="Settings"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.8 1.8-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V22h-2.54v-.1a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.8-1.8.06-.06A1.7 1.7 0 0 0 8.1 15a1.7 1.7 0 0 0-1.56-1.03H6.4v-2.54h.14A1.7 1.7 0 0 0 8.1 10.4a1.7 1.7 0 0 0-.34-1.88L7.7 8.46l1.8-1.8.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V5h2.54v.5a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.8 1.8-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.14v2.54h-.14A1.7 1.7 0 0 0 19.4 15z"></path>
          </svg>
        </button>

      </div>
    </header>


    <!-- ======================================
         HERO
    ======================================= -->

    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">
          BALENRISTA / STOCK SYSTEM
        </div>

        <h1>
          Coffee Supply
          <br />
          Inventory
        </h1>

        <p class="hero-description">
          จัดการสินค้า วัตถุดิบ และสต็อกของ Balenrista
          ในระบบเดียว
        </p>

      </div>

    </section>


    <!-- ======================================
         SEARCH
    ======================================= -->

    <section class="search-area">

      <div class="search-box">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Search product..."
          autocomplete="off"
        />

      </div>

      <button
        class="filter-button"
        aria-label="Filter"
        title="Filter"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 6h16"></path>
          <path d="M7 12h10"></path>
          <path d="M10 18h4"></path>
        </svg>
      </button>

    </section>


    <!-- ======================================
         CATEGORY
    ======================================= -->

    <section>

      <div class="section-header">

        <div class="section-title">
          Products
        </div>

        <div
          class="section-count"
          id="productCount"
        >
          —
        </div>

      </div>

      <div
        class="category-row"
        id="categoryRow"
      >

        <button
          class="category-chip active"
          data-category="all"
        >
          All Products
        </button>

      </div>

    </section>

      <!-- ======================================
         STOCK ALERT
    ======================================= -->

    <section
      class="stock-alert-section"
      id="stockAlertSection"
      style="display: none;"
    >

      <div class="section-header">

        <div class="section-title">
          Stock Alert
        </div>

        <div
          class="section-count"
          id="stockAlertCount"
        >
          0 items
        </div>

      </div>

      <div
        class="stock-alert-list"
        id="stockAlertList"
      ></div>

    </section>
    
    <!-- ======================================
         PRODUCT GRID
    ======================================= -->

    <section
      class="product-grid"
      id="productGrid"
    >

      <div class="status">
        กำลังโหลดสินค้า...
      </div>

    </section>

  </main>


  <!-- ======================================
       BOTTOM NAV
  ======================================= -->

  <nav class="bottom-nav">

    <button class="nav-item active">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v11h14V9"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>

      <span>Home</span>

    </button>


    <button class="nav-item">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="4" y="4" width="16" height="16" rx="3"></rect>
        <path d="M8 8h8"></path>
        <path d="M8 12h8"></path>
        <path d="M8 16h5"></path>
      </svg>

      <span>Stock</span>

    </button>


    <button class="nav-item">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 7h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 17h16"></path>
      </svg>

      <span>Catalog</span>

    </button>


    <button class="nav-item">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 19V5"></path>
        <path d="M4 19h16"></path>
        <path d="m7 15 3-3 3 2 5-6"></path>
      </svg>

      <span>Dashboard</span>

    </button>

  </nav>


  <!-- ======================================
       APP SCRIPT
  ======================================= -->

  <script src="./app.js"></script>

</body>
</html>
